<!-- SLIDER & DYNAMIC DATA SCRIPT -->
<script>
    let currentTestiSlide = 0;
    let testimoniList = [];

    async function applyDynamicSiteData() {
        try {
            const res = await fetch('data.json?t=' + new Date().getTime());
            if (!res.ok) return;
            const data = await res.json();

            // 1. Top Bar
            if (data.topbar) {
                const tb = data.topbar;
                const loc = document.querySelector('header .fa-location-dot');
                if (loc && loc.nextElementSibling) loc.nextElementSibling.textContent = tb.address;
                const ph = document.querySelector('header .fa-phone');
                if (ph && ph.nextElementSibling) ph.nextElementSibling.textContent = tb.phone;
                const em = document.querySelector('header .fa-envelope');
                if (em && em.nextElementSibling) em.nextElementSibling.textContent = tb.email;
            }

            // 2. Jenjang Pendidikan (RA, SDIT, SMPIT Boarding, SMAIT Boarding)
            if (data.jenjang_section && data.jenjang_section.items) {
                const items = data.jenjang_section.items;
                items.forEach(item => {
                    const contentEl = document.getElementById('content-' + item.id);
                    if (contentEl) {
                        const title = contentEl.querySelector('h3');
                        if (title) title.textContent = item.title;
                        const desc = contentEl.querySelector('p');
                        if (desc) desc.textContent = item.desc;
                        const img = contentEl.querySelector('img');
                        if (img) img.src = item.image;
                    }
                });
            }

            // 3. Jadwal & Fasilitas
            if (data.jadwal_section && data.jadwal_section.items) {
                const jGrid = document.querySelector('#jadwal .grid');
                if (jGrid) {
                    jGrid.innerHTML = data.jadwal_section.items.map(j => `
                        <div class="border border-slate-200 rounded-2xl p-6 bg-slate-50 shadow-sm hover:shadow-md transition-all border-l-4 border-l-emerald-600">
                            <span class="text-xs font-bold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-md">${j.time}</span>
                            <h4 class="font-bold text-lg text-emerald-950 mt-3">${j.title}</h4>
                            <p class="text-xs text-slate-600 mt-1">${j.desc}</p>
                        </div>
                    `).join('');
                }
            }

            if (data.fasilitas_section && data.fasilitas_section.items) {
                const fGrid = document.querySelector('#fasilitas .grid');
                if (fGrid) {
                    fGrid.innerHTML = data.fasilitas_section.items.map(f => `
                        <div class="group relative rounded-2xl overflow-hidden shadow-xl bg-slate-800">
                            <img src="${f.image}" alt="${f.title}" class="h-64 w-full object-cover group-hover:scale-110 transition-transform duration-500">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent p-6 flex flex-col justify-end">
                                <h3 class="text-xl font-bold text-amber-300">${f.title}</h3>
                                <p class="text-xs text-slate-300 mt-1">${f.desc}</p>
                            </div>
                        </div>
                    `).join('');
                }
            }

            // 4. Transparansi Biaya (Calculated Automatically)
            if (data.simulasi_section && data.simulasi_section.pricing) {
                window.sitePricingData = data.simulasi_section.pricing;
                if (typeof calculateFee === 'function') calculateFee();
            }

            // 5. Sebaran Alumni & Testimoni Slider with Pagination Dots
            if (data.alumni_section) {
                const aSec = data.alumni_section;
                // Campuses
                const campBox = document.querySelector('section.bg-slate-900 .flex-wrap');
                if (campBox && aSec.campuses) {
                    campBox.innerHTML = aSec.campuses.map(c => `
                        <span class="font-extrabold text-lg sm:text-xl text-slate-300 hover:text-amber-400 transition-colors">
                            <i class="fa-solid fa-graduation-cap text-amber-400 mr-2"></i> ${c}
                        </span>
                    `).join('');
                }

                // Testimoni Slider
                if (aSec.testimonials && aSec.testimonials.length > 0) {
                    testimoniList = aSec.testimonials;
                    renderTestiSlider();
                }
            }

            // 6. Footer Text
            if (data.footer) {
                const ftBio = document.querySelector('footer p.text-xs');
                if (ftBio) ftBio.textContent = data.footer.bio_text;
                const ftCopy = document.querySelector('footer p');
                if (ftCopy && data.footer.copyright) ftCopy.textContent = data.footer.copyright;
            }

            // 7. Seksi Visibility
            if (data.sections) {
                Object.keys(data.sections).forEach(key => {
                    const el = document.getElementById(key);
                    if (el) el.style.display = data.sections[key] === false ? 'none' : 'block';
                });
            }

        } catch (e) { console.log(e); }
    }

    // Render Testimoni Slider + Dots
    function renderTestiSlider() {
        const testiBox = document.querySelector('section.bg-slate-900 .grid.grid-cols-1.md\\:grid-cols-2');
        if (!testiBox || testimoniList.length === 0) return;

        const t = testimoniList[currentTestiSlide];
        testiBox.innerHTML = `
            <div class="glass-dark p-8 rounded-2xl border border-slate-700 md:col-span-2 max-w-2xl mx-auto text-center">
                <img src="${t.photo}" class="w-20 h-20 rounded-full object-cover border-2 border-amber-400 mx-auto mb-4">
                <h4 class="font-bold text-white text-lg">${t.name}</h4>
                <p class="text-xs text-amber-300 mb-4">${t.role}</p>
                <p class="text-slate-300 text-sm italic leading-relaxed">"${t.quote}"</p>
            </div>
            <div class="md:col-span-2 flex justify-center gap-2 mt-4" id="testi-dots">
                ${testimoniList.map((_, i) => `
                    <button onclick="goToTesti(${i})" class="${i === currentTestiSlide ? 'w-8 bg-amber-400' : 'w-3 bg-white/30'} h-2.5 rounded-full transition-all duration-300"></button>
                `).join('')}
            </div>
        `;
    }

    function goToTesti(idx) {
        currentTestiSlide = idx;
        renderTestiSlider();
    }

    // Override Calculate Fee dari data.json
    function calculateFee() {
        const jenjang = document.getElementById('calc-jenjang').value;
        const jalur = document.getElementById('calc-jalur').value;

        let pangkal = 12500000, spp = 1800000, seragam = 2200000;

        if (window.sitePricingData && window.sitePricingData[jenjang]) {
            const p = window.sitePricingData[jenjang];
            pangkal = p.pangkal;
            spp = p.spp;
            seragam = p.seragam;
        }

        if (jalur === 'prestasi') pangkal = pangkal * 0.75;

        const total = pangkal + spp + seragam;

        document.getElementById('res-pangkal').textContent = 'Rp ' + pangkal.toLocaleString('id-ID');
        document.getElementById('res-spp').textContent = 'Rp ' + spp.toLocaleString('id-ID');
        document.getElementById('res-seragam').textContent = 'Rp ' + seragam.toLocaleString('id-ID');
        document.getElementById('res-total').textContent = 'Rp ' + total.toLocaleString('id-ID');
    }

    document.addEventListener('DOMContentLoaded', applyDynamicSiteData);
</script>
